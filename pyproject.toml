[project]
name = "funlanzou"
version = "0.2.0"
description = "funlanzou"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `lanzou` 是废弃导入路径的兼容层（只有一个 __init__.py，转发到 funlanzou），
# 保留到下一次破坏性版本再删除。
packages = ["funlanzou", "lanzou"]
